# jobhunt configuration. Tuned for Siddhant's profile:
# - 3rd-year CS student / new-grad-level candidate
# - Strong backend experience with Node.js, Express.js, PostgreSQL, MongoDB, Redis
# - Distributed systems / concurrency / API / infrastructure exposure
# - AWS, Docker, Kubernetes, WebSockets
# - Production startup experience
# - 350+ LeetCode problems
#
# Priority: Backend Engineer / Software Engineer / SDE / Platform / Systems /
# Infrastructure roles where a strong CS + backend foundation is valuable.

filters:
  # Title regexes, matched case-insensitively against the job title only.
  # A title must match at least one include AND zero excludes.
  include_titles:
    # Software / SDE / SWE / Developer variants
    - '\bsoftware\s+engineer\b'
    - '\bsoftware\s+development\s+engineer\b'
    - '\bsoftware\s+developer\b'
    - '\bsde(-?\s*1|-?\s*i|\b)'
    - '\bswe(-?\s*1|-?\s*i|\b)'
    - '\bengineer\b'
    - '\bdeveloper\b'
    - '\bbackend\b'
    - '\bback[-\s]?end\b'
    - '\bnode(\.?js)?\b'
    - '\btypescript\b'
    - '\bpython\b'

    # Technical Staff & Early Career / Associate / Trainee / Intern
    - '\bmts(-?\s*1|-?\s*i|\b)'
    - '\bmember\s+of\s+technical\s+staff\b'
    - '\bassociate\b'
    - '\bjunior\b'
    - '\bgraduate\b'
    - '\bentry\s+level\b'
    - '\bearly\s+career\b'
    - '\bintern\b'
    - '\binternship\b'

    # Platform / Infra / Systems / Cloud / DevOps
    - '\bplatform\b'
    - '\binfrastructure\b'
    - '\binfra\b'
    - '\bdistributed\b'
    - '\bsystems\b'
    - '\bcloud\b'
    - '\bdevops\b'
    - '\bsre\b'
    - '\bsite\s+reliability\b'

    # Fullstack & AI / LLM Integration (LangChain, Voice bots, GenAI)
    - '\bfull[-\s]?stack\b'
    - '\bweb\b'
    - '\bai\b'
    - '\bllm\b'
    - '\bgenai\b'
    - '\bgenerative\s+ai\b'

  exclude_titles:
    # Seniority levels clearly beyond 0-2 YOE (Staff, Principal, Senior, Lead, Executive)
    - '\b(staff|principal|distinguished|fellow|architect)\b'
    - '\b(senior|sr\.?|lead|tech\s+lead)\b'
    - '\b(director|vp|vice\s+president|head\s+of|chief|cto|manager|management)\b'

    # Non-engineering / non-backend roles
    - '\b(sales|account\s+executive|marketing|recruiter|recruitment|human\s+resources|legal|accounting|customer\s+support|customer\s+success)\b'

    # Pure specialized non-backend / design roles
    - '\b(frontend|front-end|ui/ux\s+designer|graphic\s+designer)\b'


  locations:
    - new delhi
    - noida
    - gurugram
    - gurgaon
    - delhi-ncr
    - pune
    - bangalore
    - bengaluru
    - hyderabad
    - mumbai
    - chennai
    - india

  exclude_locations:
    - '\b(us|usa|united\s+states)\s+only\b'
    - '\b(americas|latam|canada|emea|europe)\s+only\b'

  allow_remote: true
  max_age_days: 30

score_threshold: 5.5


# Keep the expensive drafting stage focused on the strongest opportunities.
max_per_digest: 5


# --- paths ------------------------------------------------------------------
companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv